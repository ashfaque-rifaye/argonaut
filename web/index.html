<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07080A" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Argonaut · See the vibration. Fix the machine.</title>
    <meta name="description" content="Argonaut turns any camera into a vibration analyst: Meta's models find the fault in a pump, fan, motor or engine, agents fix it, and physics proves it." />
    <script>
      // set the theme before first paint (no flash); lib/theme.ts takes over after load
      ;(function () {
        var t = null
        try { t = localStorage.getItem('argonaut-theme') } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        document.documentElement.dataset.theme = t
        document.documentElement.style.colorScheme = t
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
