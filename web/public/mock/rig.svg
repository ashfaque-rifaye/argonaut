<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2d31"/>
      <stop offset="1" stop-color="#1c1f22"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232528"/>
      <stop offset="1" stop-color="#121315"/>
    </linearGradient>
    <radialGradient id="light" cx="0.42" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#fff" stop-opacity="0.16"/>
      <stop offset="0.55" stop-color="#fff" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.35"/>
    </radialGradient>
    <linearGradient id="motor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b737b"/>
      <stop offset="0.18" stop-color="#8c949c"/>
      <stop offset="0.45" stop-color="#4d545b"/>
      <stop offset="1" stop-color="#23272b"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a8188"/>
      <stop offset="0.5" stop-color="#4a5056"/>
      <stop offset="1" stop-color="#2a2e32"/>
    </linearGradient>
    <linearGradient id="col" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2b2f33"/>
      <stop offset="0.35" stop-color="#6d747b"/>
      <stop offset="0.6" stop-color="#4a5056"/>
      <stop offset="1" stop-color="#1f2225"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a6067"/>
      <stop offset="1" stop-color="#3a3f44"/>
    </linearGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="4"/>
      <feColorMatrix values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0.09 0"/>
    </filter>
    <filter id="concrete" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.03" numOctaves="4" seed="11"/>
      <feColorMatrix values="0 0 0 0 0.6  0 0 0 0 0.6  0 0 0 0 0.6  0 0 0 0.10 0"/>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
    <clipPath id="guardClip"><ellipse cx="742" cy="262" rx="60" ry="156"/></clipPath>
  </defs>

  <rect width="960" height="420" fill="url(#wall)"/>
  <rect y="420" width="960" height="120" fill="url(#floor)"/>
  <rect width="960" height="540" filter="url(#concrete)"/>
