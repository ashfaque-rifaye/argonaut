  <ellipse cx="742" cy="262" rx="15" ry="27" fill="#4b5157"/>
  <ellipse cx="740" cy="258" rx="6" ry="10" fill="#7c838a"/>
  <g fill="none" stroke="#9aa1a8" stroke-opacity="0.55" stroke-width="1.6">
