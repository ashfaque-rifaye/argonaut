  <ellipse cx="530" cy="490" rx="300" ry="26" fill="url(#shadow)"/>
  <polygon points="300,444 752,444 792,484 262,484" fill="url(#plate)"/>
  <polygon points="262,484 792,484 792,496 262,496" fill="#25292d"/>
  <g fill="#2a2e32"><circle cx="300" cy="474" r="5"/><circle cx="756" cy="474" r="5"/><circle cx="330" cy="452" r="4"/><circle cx="724" cy="452" r="4"/></g>
  <g fill="#7d848b"><circle cx="299" cy="473" r="2"/><circle cx="755" cy="473" r="2"/></g>

  <!-- stand -->
  <ellipse cx="531" cy="440" rx="74" ry="9" fill="#000" opacity="0.4" filter="url(#soft)"/>
  <polygon points="470,424 592,424 592,438 470,438" fill="url(#steel)"/>
  <polygon points="508,420 554,420 592,424 470,424" fill="#5d646b"/>
  <rect x="512" y="314" width="40" height="108" fill="url(#col)"/>
  <rect x="504" y="372" width="56" height="6" fill="#2d3135"/>
  <g fill="#1c1f22"><circle cx="482" cy="431" r="3"/><circle cx="580" cy="431" r="3"/></g>
  <rect x="478" y="306" width="110" height="12" rx="2" fill="url(#steel)"/>
  <rect x="490" y="296" width="18" height="14" fill="#33383d"/><rect x="560" y="296" width="18" height="14" fill="#33383d"/>

  <!-- motor -->
  <rect x="388" y="214" width="234" height="98" rx="22" fill="url(#motor)"/>
  <g stroke="#1d2024" stroke-width="3" opacity="0.55">
    <line x1="420" y1="218" x2="420" y2="308"/><line x1="436" y1="216" x2="436" y2="310"/><line x1="452" y1="215" x2="452" y2="311"/>
    <line x1="468" y1="215" x2="468" y2="311"/><line x1="484" y1="215" x2="484" y2="311"/><line x1="500" y1="215" x2="500" y2="311"/>
    <line x1="516" y1="215" x2="516" y2="311"/><line x1="532" y1="215" x2="532" y2="311"/>
  </g>
  <g stroke="#a7aeb5" stroke-width="1" opacity="0.35">
    <line x1="422" y1="220" x2="422" y2="250"/><line x1="438" y1="219" x2="438" y2="250"/><line x1="454" y1="218" x2="454" y2="250"/>
    <line x1="470" y1="218" x2="470" y2="250"/><line x1="486" y1="218" x2="486" y2="250"/><line x1="502" y1="218" x2="502" y2="250"/>
    <line x1="518" y1="218" x2="518" y2="250"/><line x1="534" y1="218" x2="534" y2="250"/>
  </g>
  <ellipse cx="398" cy="263" rx="14" ry="46" fill="#3c4247"/>
  <ellipse cx="396" cy="263" rx="8" ry="34" fill="#2a2e32"/>
  <rect x="466" y="192" width="66" height="26" rx="3" fill="url(#steel)"/>
  <rect x="470" y="194" width="58" height="4" fill="#9aa1a8" opacity="0.4"/>
  <!-- nameplate (scale reference) -->
  <rect x="548" y="246" width="54" height="36" rx="2" fill="#b9bdb5"/>
  <g fill="#3b3f3c" opacity="0.8">
    <rect x="553" y="251" width="30" height="3"/><rect x="553" y="258" width="44" height="2"/><rect x="553" y="263" width="38" height="2"/>
    <rect x="553" y="268" width="44" height="2"/><rect x="553" y="273" width="26" height="2"/>
  </g>
  <!-- bearing housing -->
  <rect x="620" y="230" width="44" height="68" rx="6" fill="url(#steel)"/>
  <rect x="624" y="236" width="36" height="5" fill="#a0a7ae" opacity="0.35"/>
  <circle cx="642" cy="288" r="3" fill="#1c1f22"/><circle cx="642" cy="240" r="3" fill="#1c1f22"/>
  <rect x="664" y="256" width="40" height="14" fill="#8a9198"/>
  <rect x="664" y="257" width="40" height="3" fill="#c5cbd0" opacity="0.6"/>

  <!-- fan -->
  <g clip-path="url(#guardClip)">
    <ellipse cx="742" cy="262" rx="60" ry="156" fill="#15181b"/>
    <g fill="#3c4248" opacity="0.9">
      <path d="M742 262 C 760 200, 770 150, 748 112 C 730 150, 728 210, 742 262 Z"/>
      <path d="M742 262 C 778 280, 790 330, 772 392 C 748 360, 734 310, 742 262 Z"/>
      <path d="M742 262 C 716 300, 704 350, 714 400 C 736 370, 748 320, 742 262 Z"/>
      <path d="M742 262 C 710 230, 700 180, 716 128 C 736 170, 746 220, 742 262 Z"/>
      <path d="M742 262 C 790 250, 800 210, 790 160 C 762 200, 748 240, 742 262 Z"/>
    </g>
