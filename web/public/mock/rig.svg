  <g stroke="#202326" stroke-width="2">
    <line x1="320" y1="0" x2="320" y2="420"/><line x1="660" y1="0" x2="660" y2="420"/>
  </g>

  <!-- conduit + junction box (static reference) -->
  <rect x="146" y="0" width="12" height="118" fill="#3a3e43"/>
  <rect x="148" y="0" width="3" height="118" fill="#575c62"/>
  <rect x="96" y="118" width="110" height="114" rx="3" fill="#43484e"/>
  <rect x="96" y="118" width="110" height="10" rx="3" fill="#5c6268"/>
  <rect x="104" y="136" width="94" height="88" rx="2" fill="none" stroke="#2c3034" stroke-width="2"/>
  <circle cx="110" cy="132" r="2.4" fill="#2a2d31"/><circle cx="192" cy="132" r="2.4" fill="#2a2d31"/>
  <circle cx="110" cy="226" r="2.4" fill="#2a2d31"/><circle cx="192" cy="226" r="2.4" fill="#2a2d31"/>
  <rect x="122" y="160" width="58" height="10" rx="1" fill="#c8b25a" opacity="0.55"/>
