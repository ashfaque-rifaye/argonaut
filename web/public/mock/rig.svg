    <ellipse cx="742" cy="262" rx="50" ry="130"/>
    <ellipse cx="742" cy="262" rx="40" ry="104"/>
    <ellipse cx="742" cy="262" rx="30" ry="78"/>
    <ellipse cx="742" cy="262" rx="20" ry="52"/>
  </g>
  <g stroke="#9aa1a8" stroke-opacity="0.4" stroke-width="1.2">
    <line x1="742" y1="106" x2="742" y2="418"/>
    <line x1="682" y1="262" x2="802" y2="262"/>
    <line x1="700" y1="150" x2="784" y2="374"/>
    <line x1="784" y1="150" x2="700" y2="374"/>
  </g>
  <path d="M742 418 L 742 432 L 600 432" fill="none" stroke="#3a3f44" stroke-width="5"/>

  <rect width="960" height="540" fill="url(#light)"/>
  <rect width="960" height="540" filter="url(#grain)"/>
