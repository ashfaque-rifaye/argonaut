<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Argonaut roster</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=block" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0b0620; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; font-family: Inter, sans-serif; color: #fff;
    background: radial-gradient(1200px 800px at 12% 0%, #2c17b8, transparent 60%), radial-gradient(1000px 700px at 100% 100%, #a01f6c, transparent 55%), #0b0620; }
  h1 { position: absolute; left: 90px; top: 58px; font: 400 92px Anton, Impact, sans-serif; text-transform: uppercase; letter-spacing: .01em; }
  h1 span { font-size: 92px; }
  .grid { position: absolute; left: 90px; right: 90px; top: 196px; display: grid; gap: 22px; }
  .models { grid-template-columns: repeat(5, 1fr); }
  .acts { grid-template-columns: repeat(5, 1fr); top: 660px; }
  .card { height: 400px; padding: 26px 24px; border-radius: 22px; background: rgba(255,255,255,.07); border: 2px solid rgba(255,255,255,.12); opacity: .25; transition: none; }
  .acts .card { height: 330px; }
  .card .job { font: 700 17px "JetBrains Mono", monospace; letter-spacing: .08em; text-transform: uppercase; }
  .card .name { margin-top: 14px; font: 800 36px/1.06 Inter; letter-spacing: -.02em; }
  .card .id { margin-top: 8px; font: 500 15px "JetBrains Mono", monospace; opacity: .62; }
  .card .what { margin-top: 18px; font: 500 24px/1.3 Inter; }
  .acts .card .name { font-size: 31px; margin-top: 10px; }
  .acts .card .what { font-size: 22px; margin-top: 14px; }
  .note { position: absolute; left: 90px; top: 612px; font: 700 26px "JetBrains Mono", monospace; letter-spacing: .08em; text-transform: uppercase; color: #d7ff3a; }
</style>
</head>
<body>
<div id="stage">
  <h1><span id="H">Every model has one job</span></h1>
  <div class="grid models" id="M"></div>
  <div class="note" id="N">Then the agents act. A person approves each one.</div>
  <div class="grid acts" id="A"></div>
</div>
<script src="out/roster_cues.js"></script>
<script>
const MODELS = [
  ['The sensors', 'SAM 3.1', 'sam-3.1', 'Segments each part and tracks it through the video. Each mask becomes a sensor.', '#22e1ff'],
  ['The eyes', 'Muse Spark', 'muse-spark-1.3', 'Names the machine and its parts, counts blades, reads nameplates. Refuses rotating parts.', '#ff3ea5'],
  ['The engineer', 'Muse Wonder', 'muse-wonder-1.0', 'Calls tools, tests hypotheses, decides the fix. Every number it writes is checked.', '#d7ff3a'],
  ['The ears', 'Muse Voice Transcribe', 'muse-voice-transcribe-1.0', 'Hands-free commands on the plant floor, in Hindi and English together.', '#ff7a1a'],
  ['Private mode', 'Muse Spark Open', 'open weights', 'The same agent loop, so plant data can stay on infrastructure you control.', '#c3b8ff'],
]
const ACTS = [
  ['Balance', 'Field balance', 'Influence coefficients give the correction mass and angle, checked against ISO 21940-11.'],
  ['Protect', 'Drive skip bands', 'Locks the drive out of resonant speeds, over Modbus.'],
  ['Record', 'Work order', 'ISO 14224 failure code, tasks and safety steps, ready to file.'],
  ['Cost', 'Impact', 'Energy and downtime saved, from the measured numbers.'],
  ['Prove', 'Follow-up', 'Books the re-measurement, then a t-test on the result.'],
]
const card = ([job, name, id, what, c]) => `<div class="card"><div class="job" style="color:${c}">${job}</div><div class="name">${name}</div><div class="id">${id}</div><div class="what">${what}</div></div>`
document.getElementById('M').innerHTML = MODELS.map(card).join('')
document.getElementById('A').innerHTML = ACTS.map(([j, n, w]) => `<div class="card"><div class="job" style="color:#d7ff3a">${j}</div><div class="name">${n}</div><div class="what">${w}</div></div>`).join('')

/* cue times come from the voice-over: film/demo/voice.py writes them into out/roster_cues.js */
const CUES = window.ROSTER_CUES ?? { dur: 30, models: [1, 5, 9, 13, 17], acts: [21, 23, 25, 27, 28.5] }
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x))
const lit = (el, t, a, next, color) => {
  const on = clamp((t - a) / 0.25)
  const active = t >= a && t < next
  el.style.opacity = 0.25 + 0.75 * on
  el.style.transform = `translateY(${(1 - on) * 14}px)`
  el.style.borderColor = active ? color : 'rgba(255,255,255,.12)'
  el.style.background = active ? 'rgba(255,255,255,.14)' : 'rgba(255,255,255,.07)'
  el.style.boxShadow = active ? `0 0 46px -6px ${color}` : 'none'
}
function render(t) {
  const m = document.querySelectorAll('#M .card'), a = document.querySelectorAll('#A .card')
  m.forEach((el, i) => lit(el, t, CUES.models[i], CUES.models[i + 1] ?? CUES.acts[0], MODELS[i][4]))
  a.forEach((el, i) => lit(el, t, CUES.acts[i], CUES.acts[i + 1] ?? CUES.dur + 1, '#d7ff3a'))
  document.getElementById('N').style.opacity = clamp((t - CUES.acts[0] + 0.4) / 0.3)
}
window.render = render
window.DURATION = CUES.dur
render(0)
</script>
</body>
</html>
